name: 質問
description: Project Sprint の内容や実践について、疑問点・不明点を質問する
title: "[質問] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Project Sprint の内容や、導入・実践にあたっての疑問をお寄せください。メンバーがお答えします。
  - type: input
    id: page
    attributes:
      label: 関係するページ（あれば）
      description: 質問に関係するページの URL
      placeholder: https://www.projectsprint.org/code/step0
  - type: textarea
    id: question
    attributes:
      label: 質問の内容
      description: 何が分からないか、どう理解しているかを書いてください。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 背景（任意）
      description: どのようなプロジェクト・場面で疑問が生じたかなど
