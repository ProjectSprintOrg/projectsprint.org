name: 翻訳の指摘 / Translation feedback
description: 翻訳ページの誤訳・不自然な表現を指摘する / Report a mistranslation or an awkward passage
title: "[翻訳] "
labels: ["translation"]
body:
  - type: markdown
    attributes:
      value: |
        翻訳ページの誤訳や不自然な表現の指摘を歓迎します。英語でも日本語でも構いません。
        Feedback on translated pages is welcome, in English or Japanese.
  - type: input
    id: page
    attributes:
      label: ページの URL / Page URL
      placeholder: https://www.projectsprint.org/en/code/step0
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: 原文の箇所 / Original passage
      description: 該当する訳文と、対応する日本語原文の箇所 / The translated text and the corresponding Japanese passage
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 提案する訳 / Suggested translation
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 理由（任意） / Reason (optional)
